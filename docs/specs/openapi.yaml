# 후속 기능은 feature-improvements.openapi.yaml의 reserved 계약이며 아직 paths에 활성화하지 않는다.
openapi: 3.0.3
info:
  title: AI 맞춤형 운동프로그램 웹앱 API
  version: 1.0.0
  description: >
    기록 기반 폐루프 오토레귤레이션 코칭 웹앱의 백엔드 API.
    웹 우선(Next.js PWA) 구성: 인증은 httpOnly 세션 쿠키 + CSRF 헤더,
    결제는 국내 PG 정기결제(빌링키). 오프라인 로깅은 /sync 로 배치 동기화.
    규칙 버전(rules_version)과 reason_code 는 추천 재현/분석에 사용.
servers:
  - url: https://api.afc.example/v1
    description: production
  - url: https://staging-api.afc.example/v1
    description: staging

tags:
  - name: auth
  - name: users
  - name: programs
  - name: exercises
  - name: sessions
  - name: sync
  - name: analytics
  - name: billing

security:
  - cookieAuth: []

paths:
  /auth/owner/bootstrap:
    post:
      tags: [auth]
      summary: 단일 소유자 최초 등록(프로필·동의·admin·세션을 원자 생성)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerBootstrapRequest' }
      responses:
        '201':
          description: '등록 성공. Set-Cookie sid=...; HttpOnly; Secure; SameSite=Lax'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/owner/login:
    post:
      tags: [auth]
      summary: 소유자 복구 코드로 재로그인(쿠키 삭제·기기 변경 대응)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerLoginRequest' }
      responses:
        '200':
          description: '로그인 성공. Set-Cookie sid=...; HttpOnly; Secure; SameSite=Lax'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 세션 갱신(refresh 회전)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: 갱신됨(Set-Cookie 재발급) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃(세션 무효화)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: 로그아웃됨 }

  /me:
    get:
      tags: [users]
      summary: 내 프로필 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [users]
      summary: 프로필 수정(목표 변경 시 프로그램 재구성 트리거)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [users]
      summary: 계정/데이터 삭제 요청(소프트 삭제 후 퍼지)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202': { description: 삭제 요청 접수(비동기 퍼지) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/consents:
    post:
      tags: [users]
      summary: 개인정보/약관 동의 기록(PIPA)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Consent' }
      responses:
        '204': { description: 기록됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/export:
    get:
      tags: [users]
      summary: 내 데이터 즉시 JSON 내보내기(기계 판독)
      responses:
        '200':
          description: 현재 보유한 프로필·동의·운동 기록·파생 지표·접근 감사의 JSON 스냅샷
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/calibration:
    post:
      tags: [users]
      summary: 간이 캘리브레이션(시작 무게 추정)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [survey, amrap] }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      exercise_id: { type: string }
                      perceived_difficulty: { type: string, enum: [easy, moderate, hard] }
                      amrap_weight: { type: number, nullable: true }
                      amrap_reps: { type: integer, nullable: true }
      responses:
        '200':
          description: 초기 e1RM 산출
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Estimated1RM' }

  /programs/generate:
    post:
      tags: [programs]
      summary: 룰 기반 프로그램 생성
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateProgramRequest' }
            example:
              goal: hypertrophy
              days_per_week: 4
              minutes_per_day: 60
              experience_level: intermediate
              equipment: [barbell, dumbbell, machine]
              avoid_exercises: [e_back_squat]
              pain_areas: [knee]
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Program' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /programs/current:
    get:
      tags: [programs]
      summary: 현재 프로그램 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Program' }
        '404': { $ref: '#/components/responses/NotFound' }

  /programs/{programId}:
    patch:
      tags: [programs]
      summary: 프로그램 수정(세트수 등, 변경 사유 로깅)
      parameters:
        - name: programId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edits:
                  type: array
                  items:
                    type: object
                    properties:
                      op: { type: string, enum: [set_count, swap_exercise, reorder] }
                      payload: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Program' }

  /exercises:
    get:
      tags: [exercises]
      summary: 운동 카탈로그 조회(필터)
      parameters:
        - name: pattern
          in: query
          schema: { type: string, example: horizontal_push }
        - name: equipment
          in: query
          schema: { type: string, example: barbell }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }
                  next_cursor: { type: string, nullable: true }

  /exercises/{exerciseId}:
    get:
      tags: [exercises]
      summary: 운동 상세
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exercises/{exerciseId}/recommendation:
    get:
      tags: [exercises]
      summary: 특정 운동의 다음 세션 추천(근거 포함)
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatedRecommendation' }

  /sessions/{sessionId}:
    get:
      tags: [sessions]
      summary: 세션 + 계획세트(추천값 포함) 조회
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{sessionId}/complete:
    post:
      tags: [sessions]
      summary: 세션 완료(피드백) → 추천 재계산 트리거
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                difficulty: { type: string, enum: [easy, moderate, hard] }
                pump: { type: string, enum: [low, medium, high] }
                pain: { type: integer, minimum: 0, maximum: 10 }
      responses:
        '200':
          description: 완료 처리 및 다음 추천 반영
          content:
            application/json:
              schema:
                type: object
                required: [session, next_recommendations]
                properties:
                  session: { $ref: '#/components/schemas/Session' }
                  next_recommendations:
                    type: array
                    items: { $ref: '#/components/schemas/GatedRecommendation' }
        '400':
          description: 잘못된 입력(difficulty/pump enum 밖, pain 이 0~10 범위 밖).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 세션이 없다(내 세션이 아닌 경우 포함).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}/sets:
    post:
      tags: [sessions]
      operationId: appendSessionSet
      summary: 오늘 세션에 원본 처방 세트 한 개 추가
      description: >
        원본 raw snapshot을 복사한다. client_id는 POST와 session_set sync가 공유하는
        멱등 키이며 transport updated_at은 append intent hash에 포함하지 않는다.
        성공 재전송은 저장된 target identity의 현재 권위 row를 현재 표시 게이트로 반환한다.
        당일 scheduled/in_progress/completed에서 허용하며 다음 세션 기본 세트 수에 전파하지 않는다.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendSetRequest' }
      responses:
        '201':
          description: 원자적 추가 또는 동일 성공 identity의 현재 권위 재전송
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppendSetResult' }
        '400':
          description: 잘못된 입력 또는 알 수 없는 필드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 기존 인증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 기존 CSRF 검증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 세션이 없거나 소유하지 않음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 부분 쓰기 없는 거절. Error와 지정 refinement를 모두 만족해야 한다.
          x-afc-response-refinement: { $ref: '#/components/schemas/SessionAppendConflict' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sync:
    post:
      tags: [sync]
      summary: 오프라인 변경 배치 push + 변경 pull
      description: >
        client_id는 한 번의 로컬 변경을 식별하는 멱등 키이며 재시도에서만 재사용한다.
        기존 entity의 변경은 canonical entity_id에 대해 (updated_at, client_id) 순서로 LWW를 판정한다.
        session_set은 additive이며 서로 다른 append를 LWW로 버리지 않는다.
        session_routine → session_set 부모 의존 위상순서 → performed_set → session 완료 순으로
        적용한다. append_dependencies의 미도착/pending 선행 변경은 원 UUID로 재시도하며,
        완료 생성 시 고정한 performed_client_ids가 적용되기 전에는 완료를 성공시키지 않는다.
        pull은 서버 단조 증가 순서의 opaque cursor를 쓴다. 성공 replay mapping은 cursor/page와 별개다.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRequest' }
            example:
              since: '42'
              mutations:
                - client_id: 3f1b7c92-6a1e-4d8f-9b2a-5c7e0a1d4e63
                  entity: performed_set
                  entity_id: 8b0e6fcb-1645-4b59-8c4d-d1f3d4f4bb54
                  op: upsert
                  updated_at: '2026-07-16T10:22:00Z'
                  payload:
                    actual_weight: 62.5
                    actual_reps: 9
                    actual_rir: 2
                    actual_time_sec: null
                    pain_score: null
                    completed: true
      responses:
        '200':
          description: 적용 결과 + 변경 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /analytics/e1rm:
    get:
      tags: [analytics]
      summary: 운동별 e1RM 추세
      parameters:
        - name: exercise_id
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E1rmAnalytics' }

  /analytics/volume:
    get:
      tags: [analytics]
      summary: 근육군별 주간 볼륨(hard sets)
      parameters:
        - name: week_start
          in: query
          schema: { type: string, format: date }
        - name: weeks
          in: query
          schema: { type: integer, minimum: 1, maximum: 12, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolumeAnalytics' }

  /analytics/completion:
    get:
      tags: [analytics]
      summary: 주간 운동 완료율
      parameters:
        - name: week_start
          in: query
          schema: { type: string, format: date }
        - name: weeks
          in: query
          schema: { type: integer, minimum: 1, maximum: 12, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletionAnalytics' }

  /billing/checkout:
    post:
      tags: [billing]
      summary: 정기결제 시작(빌링키 발급 세션/파라미터 반환)
      description: 국내 PG(PortOne/토스/카카오·네이버페이) 빌링키 등록을 위한 세션 생성.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
            example:
              product_id: pro_yearly
              success_url: https://afc.example/billing/success
              fail_url: https://afc.example/billing/fail
      responses:
        '200':
          description: PG 결제창/빌링 등록 파라미터
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }

  /billing/confirm:
    post:
      tags: [billing]
      summary: 빌링키 확정 및 첫 결제 처리 → 엔타이틀먼트 부여
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billing_key, product_id]
              properties:
                billing_key: { type: string }
                product_id: { type: string }
      responses:
        '200':
          description: 구독 활성화
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        '402': { description: 결제 실패 }

  /subscriptions/status:
    get:
      tags: [billing]
      summary: 구독/엔타이틀먼트 상태 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }

  /webhooks/pg:
    post:
      tags: [billing]
      summary: PG 웹훅(결제/갱신/해지/환불 상태 동기화)
      description: 서명 검증 필수. 정기결제 자동갱신·실패·환불 이벤트를 반영.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # 서명 검증이 필수이므로 signature 는 계약상 반드시 있어야 한다.
              required: [event_type, signature, data]
              properties:
                event_type: { type: string, example: subscription.renewed }
                billing_key: { type: string }
                signature: { type: string }
                data: { type: object, additionalProperties: true }
      responses:
        '204': { description: 처리됨 }

  /sessions/{sessionId}/exercises:
    post:
      tags: [sessions]
      summary: 오늘 루틴에 운동 추가(부위별 선택)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddExerciseRequest' }
      responses:
        '200':
          description: 갱신된 세션
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          description: 잘못된 입력(exercise_id 누락, 존재하지 않는 exercise_id, sets 가 1~10 밖 등).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 세션이 없다(내 세션이 아닌 경우 포함).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            상태 충돌. **다른 날짜의** 종료된 세션은 편집할 수 없고(당일 세션은 종료 후에도 편집 가능 — F6-1),
            같은 exercise_id 는 한 세션에 한 번만 넣을 수 있다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{sessionId}/exercises/{plannedExerciseId}:
    delete:
      tags: [sessions]
      summary: 오늘 루틴에서 운동 삭제
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - name: plannedExerciseId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 갱신된 세션
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404':
          description: 세션이 없거나 그 운동이 세션에 없다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            상태 충돌. **다른 날짜의** 종료된 세션은 편집할 수 없고(당일 세션은 종료 후에도 편집 가능 — F6-1),
            이미 수행 기록이 있는 운동은 뺄 수 없다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{sessionId}/exercises/{plannedExerciseId}/swap:
    post:
      tags: [sessions]
      summary: 오늘 루틴의 운동 교체(같은 부위 대체 우선)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - name: plannedExerciseId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_exercise_id]
              properties:
                to_exercise_id: { type: string }
      responses:
        '200':
          description: 갱신된 세션
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          description: 잘못된 입력(to_exercise_id 누락, 존재하지 않는 to_exercise_id 등).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 세션이 없거나, 교체 대상 운동이 세션에 없다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            상태 충돌. **다른 날짜의** 종료된 세션은 편집할 수 없고(당일 세션은 종료 후에도 편집 가능 — F6-1),
            이미 수행 기록이 있는 운동은 교체할 수 없으며,
            이미 이 세션에 있는 종목으로는 교체할 수 없다(중복 금지).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/ad-hoc:
    post:
      tags: [sessions]
      summary: 즉석 세션 생성(휴식일에도 운동하기 — 부위 선택)
      description: >
        FEATURES_UX F8-1. 현재 프로그램에 **오늘 날짜(UTC)** 세션을 만들고 선택한 부위의 루틴을 배정한다.
        운동 선택·목표 반복·세트 수는 프로그램 생성과 같은 규칙이고,
        프로그램 생성 때 적용한 통증 부위 제외(SAFETY_PAIN_MAPPING.md)도 그대로 적용된다.
        이미 오늘 세션이 있으면 만들지 않고 409 — 클라이언트는 GET /dashboard 의 `today.session_id` 로 그 세션에 들어간다.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdHocSessionRequest' }
            example:
              body_part: chest
      responses:
        '201':
          description: 생성된 즉석 세션(계획세트 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          description: 잘못된 입력(body_part 누락 또는 enum 밖의 값).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 프로그램이 없다(먼저 POST /programs/generate).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            오늘 이미 세션이 있다. 즉석 생성 대신 그 세션으로 이동한다
            (세션 id 는 GET /dashboard 의 today.session_id).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dashboard:
    get:
      tags: [analytics]
      summary: 대시보드 요약(오늘/내일 상태 + 지표)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: httpOnly·Secure·SameSite=Lax 세션 쿠키. 변경 요청에는 X-CSRF-Token 헤더가 필요하다.

  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: CSRF 방어 토큰(쿠키 세션 기반 변경 요청 필수).
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증 필요/만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 현재 상태와 충돌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: 서비스 필수 데이터가 준비되지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: { type: object, additionalProperties: true, nullable: true }

    OwnerLoginRequest:
      type: object
      required: [owner_code]
      properties:
        owner_code:
          type: string
          minLength: 24
          maxLength: 256
          description: Secret Manager에만 보관하는 소유자 복구 코드. 요청·응답·DB·로그에 남기지 않는다.

    OwnerProfile:
      type: object
      required: [sex, birth_year, height_cm, weight_kg, body_fat_pct, goal, experience_level]
      properties:
        sex: { type: string, enum: [male, female, other] }
        birth_year: { type: integer, minimum: 1900, maximum: 2026 }
        height_cm: { type: number, minimum: 100, maximum: 250 }
        weight_kg: { type: number, minimum: 30, maximum: 300 }
        body_fat_pct: { type: number, nullable: true, minimum: 1, maximum: 70 }
        goal: { type: string, enum: [diet, hypertrophy, strength] }
        experience_level: { type: string, enum: [beginner, intermediate, advanced] }

    OwnerBootstrapRequest:
      allOf:
        - $ref: '#/components/schemas/OwnerLoginRequest'
        - type: object
          required: [profile, consents]
          properties:
            profile: { $ref: '#/components/schemas/OwnerProfile' }
            consents:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/Consent' }

    AuthResult:
      type: object
      required: [csrf_token, user]
      properties:
        csrf_token: { type: string }
        user:
          type: object
          required: [id, is_new]
          properties:
            id: { type: string, format: uuid }
            is_new: { type: boolean }

    Profile:
      type: object
      required:
        [id, sex, birth_year, height_cm, weight_kg, body_fat_pct, goal, experience_level, plan_tier]
      properties:
        id: { type: string }
        sex: { type: string, enum: [male, female, other] }
        birth_year: { type: integer }
        height_cm: { type: number }
        weight_kg: { type: number }
        body_fat_pct: { type: number, nullable: true }
        goal: { type: string, enum: [diet, hypertrophy, strength] }
        experience_level: { type: string, enum: [beginner, intermediate, advanced] }
        days_per_week: { type: integer }
        minutes_per_day: { type: integer }
        plan_tier: { type: string, enum: [free, pro] }

    ProfileUpdate:
      type: object
      properties:
        weight_kg: { type: number }
        body_fat_pct: { type: number }
        goal: { type: string, enum: [diet, hypertrophy, strength] }
        days_per_week: { type: integer }
        minutes_per_day: { type: integer }
        experience_level: { type: string, enum: [beginner, intermediate, advanced] }

    Consent:
      type: object
      required: [type, version, granted]
      properties:
        type: { type: string, example: privacy_policy }
        version: { type: string, example: '2026-07-16' }
        granted: { type: boolean }

    DataExport:
      type: object
      required: [exported_at, profile, consents, data]
      properties:
        exported_at: { type: string, format: date-time }
        profile: { $ref: '#/components/schemas/Profile' }
        consents:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Consent'
              - type: object
                required: [granted_at]
                properties:
                  granted_at: { type: string, format: date-time }
        data:
          type: object
          required: [programs, sessions, estimated_1rm, muscle_weekly_load, calibration_sets, access_audits, assistance_audits]
          properties:
            programs: { type: array, items: { type: object, additionalProperties: true } }
            sessions: { type: array, items: { type: object, additionalProperties: true } }
            estimated_1rm: { type: array, items: { type: object, additionalProperties: true } }
            muscle_weekly_load: { type: array, items: { type: object, additionalProperties: true } }
            rir_calibration: { type: object, nullable: true, additionalProperties: true }
            calibration_sets: { type: array, items: { type: object, additionalProperties: true } }
            access_audits: { type: array, items: { type: object, additionalProperties: true } }
            # 어시스트 처방 row 에 매달린 기술 감사 기록. 보존 중인 것만 나오고, planned row 가
            # 삭제되면 같은 트랜잭션에서 함께 사라진다(SECURITY_PIPA.md 삭제 정책).
            assistance_audits: { type: array, items: { type: object, additionalProperties: true } }

    GenerateProgramRequest:
      type: object
      required: [goal, days_per_week, minutes_per_day, experience_level]
      properties:
        goal: { type: string, enum: [diet, hypertrophy, strength] }
        days_per_week: { type: integer, minimum: 2, maximum: 6 }
        minutes_per_day: { type: integer, enum: [30, 45, 60, 75, 90] }
        experience_level: { type: string, enum: [beginner, intermediate, advanced] }
        equipment:
          type: array
          items: { type: string }
        avoid_exercises:
          type: array
          items: { type: string }
        pain_areas:
          # 통증 부위 → 제외 movement_pattern 매핑은 docs/SAFETY_PAIN_MAPPING.md 가 유일한 출처이고,
          # 아래 enum 은 그 매핑표의 8개 부위다.
          # 알 수 없는 값(오타·대소문자·한글)은 400 이다 — 무시하면 안전 필터가 조용히 무력화된다.
          # 제외 결과는 Program.excluded_exercises 로 돌려준다.
          type: array
          items:
            type: string
            enum: [knee, lower_back, shoulder, elbow, wrist, hip, neck, ankle]
            example: knee

    Program:
      type: object
      # excluded_exercises 는 안전 근거(SAFETY_PAIN_MAPPING.md 규칙 3)라 생략 가능하면 안 된다.
      # 제외가 없었으면 빈 배열이다(구현은 항상 내보낸다).
      required:
        [
          program_id,
          goal,
          split_type,
          rules_version,
          started_at,
          total_weeks,
          current_week,
          status,
          excluded_exercises,
          sessions,
        ]
      properties:
        program_id: { type: string }
        goal: { type: string }
        split_type: { type: string, example: upper_lower }
        rules_version: { type: string, example: '2026.08.1' }
        started_at: { type: string, format: date }
        total_weeks: { type: integer, minimum: 12, maximum: 12 }
        current_week: { type: integer, minimum: 1, maximum: 12 }
        status: { type: string, enum: [active, completed] }
        # pain_areas 로 후보에서 뺀 운동과 사유(docs/SAFETY_PAIN_MAPPING.md 규칙 3).
        # 비어 있으면 제외가 없었다는 뜻이다.
        excluded_exercises:
          type: array
          items:
            type: object
            required: [exercise_id, pain_area, movement_pattern, reason]
            properties:
              exercise_id: { type: string, example: e_back_squat }
              pain_area: { type: string, example: knee }
              movement_pattern: { type: string, example: squat }
              reason:
                type: string
                example: '무릎 통증으로 squat 패턴을 제외했다(일반적 회피 가이드이며 의료적 조언이 아니다).'
        sessions:
          type: array
          items:
            type: object
            required: [day, focus, exercises]
            properties:
              day: { type: string, example: MON }
              focus: { type: string, example: upper }
              exercises:
                type: array
                items:
                  type: object
                  # metric=time 종목(e_plank)은 반복·RIR 대신 time_*_sec 로 처방한다 → 반복 축은 null.
                  required: [exercise_id, sets, reps_low, reps_high, target_rir, rest_sec]
                  properties:
                    exercise_id: { type: string }
                    sets: { type: integer }
                    reps_low: { type: integer, nullable: true }
                    reps_high: { type: integer, nullable: true }
                    target_rir: { type: integer, nullable: true }
                    rest_sec: { type: integer }
                    time_low_sec: { type: integer, nullable: true }
                    time_high_sec: { type: integer, nullable: true }

    Exercise:
      type: object
      # metric=reps 종목은 rep_range_*, metric=time 종목(e_plank)은 default_time_*_sec 를 채운다.
      # 서로 배타적이라 rep_range_low/high 는 required 에서 제외한다.
      required:
        [
          id,
          name_ko,
          name_en,
          movement_pattern,
          primary_muscles,
          equipment,
          difficulty,
          mechanic,
          region,
          metric,
          step_kg,
          default_time_low_sec,
          default_time_high_sec,
          substitutions,
          media_url,
        ]
      properties:
        id: { type: string }
        name_ko: { type: string }
        name_en: { type: string }
        movement_pattern: { type: string }
        primary_muscles:
          type: array
          items: { type: string }
        equipment: { type: string }
        difficulty: { type: string }
        mechanic: { type: string, enum: [compound, isolation] }
        region: { type: string, enum: [upper, lower, core] }
        metric: { type: string, enum: [reps, time] }
        step_kg: { type: number, nullable: true }
        rep_range_low: { type: integer }
        rep_range_high: { type: integer }
        default_time_low_sec: { type: integer, nullable: true }
        default_time_high_sec: { type: integer, nullable: true }
        substitutions:
          type: array
          items: { type: string }
        media_url: { type: string, nullable: true }

    Session:
      type: object
      required: [id, program_id, goal, scheduled_date, status, planned_sets]
      properties:
        id: { type: string }
        program_id: { type: string }
        goal: { type: string, enum: [diet, hypertrophy, strength] }
        scheduled_date: { type: string, format: date }
        status: { type: string, enum: [scheduled, in_progress, completed] }
        planned_sets:
          type: array
          items: { $ref: '#/components/schemas/PlannedSet' }

    PlannedSet:
      type: object
      # 맨몸(자체중량) 종목은 recommended_weight 가 null 이고, metric=time 종목(e_plank)은
      # 반복·RIR 축이 없어 target_reps_*/target_rir/recommended_reps 가 null + target_time_*_sec 를 쓴다.
      required:
        [
          id,
          exercise_id,
          set_no,
          target_reps_low,
          target_reps_high,
          target_rir,
          rest_sec,
          recommended_weight,
          recommended_reps,
          reason_code,
          confidence,
          rules_version,
          load_kind,
          recommendation_state,
          assistance_provenance,
          recommended_action,
          assistance_safety_status,
          recommendation_gate,
          performed_set,
          source_revision,
          append_eligibility,
          correlation_id,
        ]
      properties:
        id: { type: string }
        exercise_id: { type: string }
        set_no: { type: integer }
        target_reps_low: { type: integer, nullable: true }
        target_reps_high: { type: integer, nullable: true }
        target_rir: { type: integer, nullable: true }
        rest_sec: { type: integer }
        target_time_low_sec: { type: integer, nullable: true }
        target_time_high_sec: { type: integer, nullable: true }
        recommended_weight: { type: number, nullable: true }
        recommended_reps: { type: integer, nullable: true }
        reason_code: { type: string, nullable: true, example: WEIGHT_UP_REP_TARGET_MET }
        confidence: { type: number, nullable: true }
        rules_version: { type: string }
        # 부하 축의 의미. 구조적 사실이라 표시 게이트에 가려지지 않는다.
        load_kind: { type: string, enum: [external, bodyweight, assistance, not_applicable] }
        # 게이트가 처방을 가리면 함께 null 이다(처방의 일부다).
        # nullable + enum 은 목록에 null 을 넣어야 검증기가 통과시킨다(OAS 3.0).
        recommendation_state:
          type: string
          nullable: true
          enum: [ready, load_calibration_needed, substitution_required, unavailable, null]
        # non-assisted 는 반드시 null 이다 — 빈 문자열·기본값으로 채우지 않는다(§F).
        assistance_provenance:
          type: string
          nullable: true
          enum: [native, remediated, legacy_performed, null]
        # 최소 경계의 종목 전환 제안에만 붙는다. 안전 상태·비어시스트는 null 이다.
        recommended_action:
          type: object
          nullable: true
          required: [kind, exercise_id]
          properties:
            kind: { type: string, enum: [suggest_exercise_swap] }
            exercise_id: { type: string }
        # 표시 게이트 적용 **전** raw 행으로 계산한다. 게이트가 값을 가렸다고 안전해지지 않는다.
        # non-assisted 는 null. 클라이언트는 null·누락·unsafe 를 전부 fail closed 로 다룬다.
        assistance_safety_status:
          type: string
          nullable: true
          enum: [safe, unsafe, null]
        recommendation_gate: { $ref: '#/components/schemas/DisplayGateState' }
        source_revision:
          type: string
          minLength: 1
          description: 실제 수행값·표시 게이트·updated_at을 제외한 원본 raw snapshot의 opaque revision.
        correlation_id:
          type: string
          format: uuid
          nullable: true
          description: 생성 시 고정한 correlation identity. ACK 이전 GET에서도 정확히 중복을 판별하며 성공 receipt를 대신하지 않는다.
        append_eligibility:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AppendEligibility'
          description: 같은 raw/source/cohort snapshot의 복사 자격. 날짜·cap·소유권의 쓰기 허가는 아니다.
        performed_set:
          allOf:
            - $ref: '#/components/schemas/PerformedSetSummary'
          nullable: true

    PerformedSet:
      type: object
      # metric=reps 는 actual_weight/actual_reps 를, metric=time 종목(e_plank)은 actual_time_sec 를
      # 기록한다(서로 배타적이라 반대쪽 축은 null 이다).
      properties:
        planned_set_id: { type: string }
        actual_weight: { type: number, nullable: true }
        actual_reps: { type: integer, nullable: true }
        actual_rir: { type: integer, nullable: true }
        actual_time_sec: { type: integer, nullable: true }
        pain_score: { type: integer, nullable: true }
        completed: { type: boolean }
        client_id: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }

    Recommendation:
      type: object
      # weight=null 은 자체중량(맨몸·시간 종목) — 추가 부하를 처방하지 않는다는 뜻이다.
      # metric=time 종목은 reps_low/reps_high 가 null 이고 time_low_sec/time_high_sec 를 채운다.
      required:
        [
          exercise_id,
          weight,
          reps_low,
          reps_high,
          sets,
          reason_code,
          confidence,
          explanation,
          rules_version,
          load_kind,
          recommendation_state,
          recommended_action,
        ]
      properties:
        exercise_id: { type: string }
        weight: { type: number, nullable: true }
        # 부하 축의 의미. assistance 는 숫자가 "기계가 덜어주는 kg" 이라 방향이 반대다 —
        # weight=null 하나로는 "무게 미정"과 "자체중량"을 구분할 수 없다.
        load_kind: { type: string, enum: [external, bodyweight, assistance, not_applicable] }
        recommendation_state:
          { type: string, enum: [ready, load_calibration_needed, substitution_required, unavailable] }
        # 최소 경계의 종목 전환 제안에만 쓴다. 안전 상태에서는 항상 null 이다.
        recommended_action:
          type: object
          nullable: true
          required: [kind, exercise_id]
          properties:
            kind: { type: string, enum: [suggest_exercise_swap] }
            exercise_id: { type: string }
        reps_low: { type: integer, nullable: true }
        reps_high: { type: integer, nullable: true }
        sets: { type: integer }
        time_low_sec: { type: integer, nullable: true }
        time_high_sec: { type: integer, nullable: true }
        reason_code: { type: string }
        confidence: { type: number }
        explanation: { type: string, example: '최근 3세트 모두 상단·RIR 2 → +2.5kg' }
        rules_version: { type: string }

    Estimated1RM:
      type: object
      required: [exercise_id, e1rm, method, computed_at]
      properties:
        exercise_id: { type: string }
        e1rm: { type: number }
        method: { type: string, example: epley }
        computed_at: { type: string, format: date-time }

    DisplayGateState:
      type: string
      enum: [no_history, early, ready]

    PerformedSetSummary:
      type: object
      required:
        [actual_weight, actual_reps, actual_rir, actual_time_sec, completed, performed_at]
      properties:
        actual_weight: { type: number, nullable: true }
        actual_reps: { type: integer, nullable: true }
        actual_rir: { type: integer, minimum: 0, maximum: 6, nullable: true }
        actual_time_sec: { type: integer, nullable: true }
        completed: { type: boolean }
        performed_at: { type: string, format: date-time }

    GatedRecommendation:
      type: object
      required: [exercise_id, sample_session_count, gate_state, recommendation]
      properties:
        exercise_id: { type: string }
        sample_session_count: { type: integer, minimum: 0 }
        gate_state: { $ref: '#/components/schemas/DisplayGateState' }
        recommendation:
          allOf:
            - $ref: '#/components/schemas/Recommendation'
          nullable: true

    E1rmAnalytics:
      type: object
      required:
        [exercise_id, sample_session_count, gate_state, observations, points, next_recommendation]
      properties:
        exercise_id: { type: string }
        sample_session_count: { type: integer, minimum: 0 }
        gate_state: { $ref: '#/components/schemas/DisplayGateState' }
        observations:
          type: array
          description: 완료 세션 날짜. early 상태의 점 표시에 쓰며 e1RM 값은 포함하지 않는다.
          items:
            type: object
            required: [session_id, date]
            properties:
              session_id: { type: string }
              date: { type: string, format: date }
        points:
          type: array
          description: gate_state=ready에서만 값이 있으며 date, session_id 순으로 결정적으로 정렬한다.
          items:
            type: object
            required: [session_id, date, e1rm, method, is_pr]
            properties:
              session_id: { type: string }
              date: { type: string, format: date }
              e1rm: { type: number }
              method: { type: string }
              is_pr: { type: boolean }
        next_recommendation:
          allOf:
            - $ref: '#/components/schemas/Recommendation'
          nullable: true

    VolumeAnalytics:
      type: object
      required: [goal, recommendation_range, weeks]
      properties:
        goal: { type: string, enum: [diet, hypertrophy, strength] }
        recommendation_range:
          type: object
          nullable: true
          required: [min_hard_sets, max_hard_sets]
          properties:
            min_hard_sets: { type: integer }
            max_hard_sets: { type: integer }
        weeks:
          type: array
          items:
            type: object
            required: [week_start, muscles]
            properties:
              week_start: { type: string, format: date }
              muscles:
                type: array
                items:
                  type: object
                  required: [muscle, hard_sets, volume_load, avg_rir, range_status]
                  properties:
                    muscle: { type: string }
                    hard_sets: { type: integer }
                    volume_load: { type: number }
                    avg_rir: { type: number, nullable: true }
                    range_status:
                      type: string
                      enum: [below, within, above, not_applicable]

    RhythmDay:
      type: object
      required: [date, state, session_id, focus]
      properties:
        date: { type: string, format: date }
        state:
          type: string
          enum:
            [unperformed, in_progress, completed, partial, rest, conflict, return_after_gap, scheduled]
        session_id: { type: string, nullable: true }
        focus: { type: string, nullable: true }

    CompletionAnalytics:
      type: object
      required: [program_id, started_at, total_weeks, current_week, weeks]
      properties:
        program_id: { type: string }
        started_at: { type: string, format: date }
        total_weeks: { type: integer, minimum: 12, maximum: 12 }
        current_week: { type: integer, minimum: 1, maximum: 12 }
        weeks:
          type: array
          items:
            type: object
            required: [week_start, week_number, completed, planned, rate, days]
            properties:
              week_start: { type: string, format: date }
              week_number: { type: integer, minimum: 1, maximum: 12 }
              completed: { type: integer }
              planned: { type: integer }
              rate: { type: number }
              days:
                type: array
                items: { $ref: '#/components/schemas/RhythmDay' }

    SyncRequest:
      type: object
      required: [mutations]
      properties:
        since:
          type: string
          nullable: true
          description: 직전 SyncResponse.next_cursor. 서버 순서를 감춘 opaque cursor이며 시각이 아니다.
        mutations:
          type: array
          items: { $ref: '#/components/schemas/Mutation' }

    Mutation:
      type: object
      required: [client_id, entity, entity_id, op, updated_at, payload]
      properties:
        client_id:
          type: string
          format: uuid
          description: 한 번의 로컬 변경 ID. 같은 변경의 네트워크 재시도에서만 재사용한다.
        entity: { type: string, enum: [performed_set, session_routine, session, session_set] }
        entity_id:
          type: string
          format: uuid
          description: performed_set은 planned_set_id, 나머지는 workout_session.id.
        op: { type: string, enum: [upsert, delete] }
        updated_at:
          type: string
          format: date-time
          description: 클라이언트 변경 시각. 같은 entity_id의 LWW 1차 비교값.
        payload:
          anyOf:
            - $ref: '#/components/schemas/PerformedSetMutationPayload'
            - $ref: '#/components/schemas/SessionRoutineMutationPayload'
            - $ref: '#/components/schemas/SessionMutationPayload'
            - $ref: '#/components/schemas/AppendSetPayload'
          description: >
            entity에 대응하는 payload. delete는 빈 객체를 허용하며 서비스가 entity/op 조합을 검증한다.
        append_dependencies:
          $ref: '#/components/schemas/CompletionAppendDependencies'
      # 기존 payload 검증은 유지하며 새 append/dependency 조합만 좁게 제한한다.
      oneOf:
        - $ref: '#/components/schemas/AppendSetSyncMutation'
        - properties:
            entity: { enum: [performed_set, session_routine, session] }
          anyOf:
            - not: { required: [append_dependencies] }
            - required: [append_dependencies]
              properties:
                entity: { enum: [performed_set] }
                append_dependencies: { $ref: '#/components/schemas/AppendDependencies' }
            - required: [append_dependencies]
              properties:
                entity: { enum: [session] }
                op: { enum: [upsert] }
                payload:
                  required: [status]
                  properties:
                    status: { enum: [completed] }
                append_dependencies: { $ref: '#/components/schemas/CompletionAppendDependencies' }

    ServerAppendSource:
      type: object
      additionalProperties: false
      required: [source_planned_set_id, source_revision]
      properties:
        source_planned_set_id: { type: string, format: uuid }
        source_revision: { type: string, minLength: 1 }

    ProvisionalAppendSource:
      type: object
      additionalProperties: false
      required: [source_correlation_id]
      properties:
        source_correlation_id: { type: string, format: uuid }

    AppendSource:
      oneOf:
        - $ref: '#/components/schemas/ServerAppendSource'
        - $ref: '#/components/schemas/ProvisionalAppendSource'

    AppendSetPayload:
      type: object
      additionalProperties: false
      required: [exercise_id, correlation_id, source]
      properties:
        exercise_id: { type: string, minLength: 1 }
        correlation_id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/AppendSource' }

    AppendSetRequest:
      type: object
      additionalProperties: false
      required: [client_id, exercise_id, correlation_id, source]
      properties:
        client_id: { type: string, format: uuid }
        exercise_id: { type: string, minLength: 1 }
        correlation_id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/AppendSource' }

    AppendSetResult:
      type: object
      additionalProperties: false
      required: [client_id, session_id, correlation_id, planned_set_id, planned_set]
      properties:
        client_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid }
        planned_set_id: { type: string, format: uuid }
        planned_set: { $ref: '#/components/schemas/PlannedSet' }

    AppendSetSyncMutation:
      type: object
      additionalProperties: false
      required: [client_id, entity, entity_id, op, updated_at, payload]
      properties:
        client_id: { type: string, format: uuid }
        entity: { type: string, enum: [session_set] }
        entity_id: { type: string, format: uuid }
        op: { type: string, enum: [upsert] }
        updated_at: { type: string, format: date-time }
        payload: { $ref: '#/components/schemas/AppendSetPayload' }

    AppendDependencies:
      type: object
      additionalProperties: false
      required: [session_id, client_ids]
      properties:
        session_id: { type: string, format: uuid }
        client_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }

    CompletionAppendDependencies:
      type: object
      additionalProperties: false
      required: [session_id, client_ids]
      description: >
        원 transport intent에 고정한 선행 UUID. 완료의 performed_client_ids는 완료 생성 tx까지
        이미 커밋한 append 관련 actual을 담고 이후 새 수정으로 확장하지 않는다.
      properties:
        session_id: { type: string, format: uuid }
        client_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        performed_client_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }

    AppendEligibility:
      type: object
      additionalProperties: false
      required: [version, source_revision, cohort_revision, status, reason]
      properties:
        version: { type: integer, enum: [1] }
        source_revision: { type: string, minLength: 1 }
        cohort_revision: { type: string, minLength: 1 }
        status: { type: string, enum: [allowed, blocked] }
        reason: { type: string, nullable: true, enum: [unsafe_assistance_snapshot, null] }
      oneOf:
        - properties:
            status: { enum: [allowed] }
            reason: { enum: [null] }
        - properties:
            status: { enum: [blocked] }
            reason: { enum: [unsafe_assistance_snapshot] }

    SessionAppendConflict:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { type: string, enum: [CONFLICT] }
            message: { type: string, minLength: 1 }
            details:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [readonly, set_cap_reached, set_number_gap, source_changed, source_removed, correlation_mismatch, idempotency_payload_mismatch, append_target_removed, unsafe_assistance_snapshot, unresolved_parent]

    PerformedSetMutationPayload:
      type: object
      additionalProperties: false
      properties:
        actual_weight: { type: number, nullable: true }
        actual_reps: { type: integer, nullable: true }
        actual_rir: { type: integer, minimum: 0, maximum: 6, nullable: true }
        actual_time_sec: { type: integer, minimum: 1, nullable: true }
        pain_score: { type: integer, minimum: 0, maximum: 10, nullable: true }
        completed: { type: boolean }

    SessionRoutineMutationPayload:
      type: object
      additionalProperties: false
      required: [exercise_ids]
      properties:
        exercise_ids:
          type: array
          uniqueItems: true
          items: { type: string }
          description: 현재 세션의 운동 순서를 나타내는 전체 snapshot.
        correlations:
          type: array
          items: { $ref: '#/components/schemas/PlannedSetCorrelation' }
          description: >
            오프라인에서 새로 만든 planned set의 임시 상관키. 기존 서버 planned set에는 보내지 않는다.
            같은 correlation_id 재전송은 반드시 같은 서버 planned_set_id로 해석한다.

    PlannedSetCorrelation:
      type: object
      additionalProperties: false
      required: [correlation_id, exercise_id, set_no]
      properties:
        correlation_id: { type: string, format: uuid }
        exercise_id: { type: string }
        set_no: { type: integer, minimum: 1, maximum: 10 }

    PlannedSetMapping:
      type: object
      additionalProperties: false
      required: [correlation_id, planned_set_id, planned_set]
      properties:
        correlation_id: { type: string, format: uuid }
        planned_set_id: { type: string, format: uuid }
        planned_set: { $ref: '#/components/schemas/PlannedSet' }

    SessionMutationPayload:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [completed] }
        difficulty: { type: string, enum: [easy, moderate, hard] }
        pump: { type: string, enum: [low, medium, high] }
        pain: { type: integer, minimum: 0, maximum: 10 }

    PlannedSetTombstone:
      type: object
      additionalProperties: false
      required: [planned_set_id, correlation_id, exercise_id]
      properties:
        planned_set_id: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid, nullable: true }
        exercise_id: { type: string }
      description: 같은 삭제 transaction에서 확인한 identity만 전달한다. 세션은 enclosing session_routine change.entity_id로 한정한다.

    SyncResponse:
      type: object
      required: [applied, conflicts, changes, planned_set_mappings, next_cursor]
      properties:
        applied:
          type: array
          items: { type: string, format: uuid }
        conflicts:
          type: array
          items:
            type: object
            required: [client_id, entity_id, reason]
            properties:
              client_id: { type: string, format: uuid }
              entity_id: { type: string, format: uuid }
              reason: { type: string, example: stale_update }
              retryable:
                type: boolean
                description: append 의존 변경에만 존재. unresolved_parent는 true, 확인된 terminal dependency는 false.
              cause_client_id: { type: string, format: uuid }
              cause_reason: { type: string }
        changes:
          type: array
          items:
            type: object
            required: [entity, entity_id, op, data, server_seq]
            properties:
              entity: { type: string, enum: [performed_set, session_routine, session, session_set] }
              entity_id:
                type: string
                format: uuid
                description: performed_set은 planned_set_id, session/session_routine/session_set은 session ID다.
              op: { type: string, enum: [upsert, delete] }
              data:
                type: object
                additionalProperties: true
                nullable: true
                properties:
                  tombstones:
                    type: array
                    items: { $ref: '#/components/schemas/PlannedSetTombstone' }
                    description: >
                      기존 session_routine 변경의 실제 삭제 identity. upsert/delete 모두 전달할 수 있으며
                      과거 metadata 없는 delete는 data:null을 유지한다. GET 누락이나 번호 추정은 삭제 증거가 아니다.
                      직접 remove/swap에 실제 삭제가 있으면 같은 편집 트랜잭션에서 기록한
                      session_routine/upsert 서버 편집 이벤트의 data.tombstones로 삭제 identity만 발행한다.
                      서버 이벤트는 기존 server_seq cursor로 changes에 전달되며
                      클라이언트 mutation receipt·applied·dependency 성공·LWW 후보로 사용하지 않는다.
              server_seq:
                type: string
                pattern: '^[0-9]+$'
                description: JSON 정밀도 손실을 피하기 위한 10진 문자열.
        planned_set_mappings:
          type: array
          items: { $ref: '#/components/schemas/PlannedSetMapping' }
          description: >
            이번 요청의 routine/append correlation에 대응하는 현재 권위 planned set.
            성공 replay는 stored target identity를 사용하며 cursor와 changes 100건 page에 관계없이 회수된다.
        next_cursor:
          type: string
          description: 마지막으로 관찰한 server_seq를 감싼 opaque cursor.

    CheckoutRequest:
      type: object
      required: [product_id]
      properties:
        product_id: { type: string, enum: [pro_monthly, pro_yearly] }
        success_url: { type: string }
        fail_url: { type: string }

    CheckoutResponse:
      type: object
      required: [pg]
      properties:
        pg: { type: string, example: portone }
        checkout_url: { type: string, nullable: true }
        params: { type: object, additionalProperties: true, description: PG SDK 초기화 파라미터 }

    SubscriptionStatus:
      type: object
      required: [tier, status]
      properties:
        tier: { type: string, enum: [free, pro] }
        status: { type: string, enum: [trial, active, grace, expired, cancelled] }
        product_id: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        renews_at: { type: string, format: date-time, nullable: true }
        trial_ends_at: { type: string, format: date-time, nullable: true }

    AddExerciseRequest:
      type: object
      required: [exercise_id]
      properties:
        exercise_id: { type: string }
        sets: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        position: { type: integer, nullable: true }

    CreateAdHocSessionRequest:
      type: object
      required: [body_part]
      properties:
        body_part:
          # F5 운동 추가 팝업의 부위 구분(가슴·등·어깨·팔·하체·코어)과 같은 6개다.
          # 부위 → movement_pattern 매핑은 서버(program-rules)가 갖고, 종목 선택은 프로그램 생성과 같은 규칙이다.
          type: string
          enum: [chest, back, shoulders, arms, legs, core]
          example: chest

    DashboardSummary:
      type: object
      required:
        [date, today, tomorrow, streak_days, weekly_completion_rate, weekly_rhythm, primary_e1rm]
      properties:
        date: { type: string, format: date }
        today:
          type: object
          # routine_summary/done_summary 는 상태와 무관하게 항상 내려가고, 해당 없으면 null 이다.
          required: [status, session_id, routine_summary, done_summary]
          properties:
            status:
              type: string
              enum: [unperformed, in_progress, done, partial, rest, conflict, return_after_gap]
            # 오늘 세션(workout_session)의 id. 대시보드 → 데일리 루틴 진입 경로다.
            # 휴식일(status=rest)이면 null.
            session_id: { type: string, nullable: true }
            routine_summary:
              type: object
              nullable: true
              required: [exercise_count, focus]
              properties:
                exercise_count: { type: integer }
                focus: { type: string }
            done_summary:
              type: object
              nullable: true
              required: [total_volume, sets_completed, pr_count]
              properties:
                total_volume: { type: number }
                sets_completed: { type: integer }
                pr_count: { type: integer }
        tomorrow:
          type: object
          required: [status, routine_summary]
          properties:
            status: { type: string, enum: [workout, rest] }
            routine_summary:
              type: object
              nullable: true
              required: [exercise_count, focus]
              properties:
                exercise_count: { type: integer }
                focus: { type: string }
        streak_days: { type: integer }
        weekly_completion_rate: { type: number }
        weekly_rhythm:
          type: array
          items: { $ref: '#/components/schemas/RhythmDay' }
        primary_e1rm:
          type: object
          nullable: true
          required: [exercise_id, sample_session_count, gate_state, latest_e1rm]
          properties:
            exercise_id: { type: string }
            sample_session_count: { type: integer, minimum: 0 }
            gate_state: { $ref: '#/components/schemas/DisplayGateState' }
            latest_e1rm: { type: number, nullable: true }
