openapi: 3.0.3
info:
  title: AFC reserved feature contracts — not runtime routes
  version: sprint01-contract-1
x-afc-status: reserved-not-implemented
x-afc-activation: Promote one feature atomically into openapi.yaml with
  DTO/codegen/schema/migration/wiring/tests in its owning sprint. This document
  is never a runtime capability declaration.
servers:
  - url: http://localhost:3001/v1
paths:
  /sessions/{id}/sets:
    post:
      operationId: appendSessionSetReserved
      x-afc-delivery-sprint: 3
      x-afc-status: promoted-to-active
      description: Promoted in Sprint03 to openapi.yaml. This historical request reservation
        is retained for the promotion audit. UTC-today append only. Shared atomic handler with
        session_set sync; client_id is durable idempotency, no Idempotency-Key
        header.
      parameters:
        - &a1
          name: id
          in: path
          required: true
          schema: &a2
            type: string
            format: uuid
        - $ref: ./openapi.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendSetRequest"
      responses:
        "201":
          description: Atomic success; exact replay returns the stored result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendSetResult"
        "400":
          description: Malformed or unsupported input
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        "401":
          description: Existing authentication guard
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        "403":
          description: Existing CSRF guard
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        "404":
          description: Absent or not owned
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        "409":
          description: Atomic rejection; no partial writes. Body must satisfy both Error
            and the mandatory x-afc-response-refinement schema on promotion.
          x-afc-response-refinement:
            $ref: "#/components/schemas/FeatureConflict"
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
  /programs/{id}/weeks/current:
    get:
      operationId: getActualCurrentWeekReserved
      x-afc-delivery-sprint: 4
      x-afc-status: promoted-to-active
      description: Promoted to openapi.yaml; historical reservation retained for audit.
      parameters:
        - *a1
      responses:
        "200":
          description: Actual current week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProgramWeek"
        "404":
          description: Absent or not owned
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
  /programs/{id}/week-swaps/candidates:
    get:
      operationId: getWeekSwapCandidatesReserved
      x-afc-delivery-sprint: 4
      x-afc-status: promoted-to-active
      description: Promoted to openapi.yaml; historical reservation retained for audit.
      parameters:
        - *a1
      responses:
        "200":
          description: Candidates with recovery/readonly reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekSwapCandidates"
        "404":
          description: Absent/not-owned program or today session
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
  /programs/{id}/week-swaps:
    post:
      operationId: swapCurrentWeekReserved
      x-afc-delivery-sprint: 4
      x-afc-status: promoted-to-active
      description: Promoted to openapi.yaml; historical reservation retained for audit.
      parameters:
        - *a1
        - $ref: ./openapi.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekSwapRequest"
      responses:
        "200":
          description: Atomic success; exact replay returns the stored result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekSwapResult"
        "400":
          description: Malformed or unsupported input
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        "401":
          description: Existing authentication guard
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        "403":
          description: Existing CSRF guard
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        "404":
          description: Absent or not owned
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        "409":
          description: Atomic rejection; no partial writes. Body must satisfy both Error
            and the mandatory x-afc-response-refinement schema on promotion.
          x-afc-response-refinement:
            $ref: "#/components/schemas/WeekSwapConflict"
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
components:
  schemas:
    SplitPreference:
      type: string
      enum:
        - balanced
        - upper_priority
        - lower_priority
    ServerAppendSource:
      type: object
      additionalProperties: false
      required:
        - source_planned_set_id
        - source_revision
      properties:
        source_planned_set_id: *a2
        source_revision: &a3
          type: string
          minLength: 1
    ProvisionalAppendSource:
      type: object
      additionalProperties: false
      required:
        - source_correlation_id
      properties:
        source_correlation_id: *a2
    AppendSource:
      oneOf:
        - $ref: "#/components/schemas/ServerAppendSource"
        - $ref: "#/components/schemas/ProvisionalAppendSource"
    AppendSetPayload:
      type: object
      additionalProperties: false
      required:
        - exercise_id
        - correlation_id
        - source
      properties:
        exercise_id: *a3
        correlation_id: *a2
        source:
          $ref: "#/components/schemas/AppendSource"
    AppendSetRequest:
      type: object
      additionalProperties: false
      required:
        - client_id
        - exercise_id
        - correlation_id
        - source
      properties:
        client_id: *a2
        exercise_id: *a3
        correlation_id: *a2
        source:
          $ref: "#/components/schemas/AppendSource"
    RevisionedPlannedSet:
      allOf:
        - $ref: ./openapi.yaml#/components/schemas/PlannedSet
        - type: object
          required:
            - source_revision
          properties:
            source_revision: *a3
    AppendSetResult:
      type: object
      additionalProperties: false
      required:
        - client_id
        - session_id
        - correlation_id
        - planned_set_id
        - planned_set
      properties:
        client_id: *a2
        session_id: *a2
        correlation_id: *a2
        planned_set_id: *a2
        planned_set:
          $ref: "#/components/schemas/RevisionedPlannedSet"
    AppendSetSyncMutation:
      type: object
      additionalProperties: false
      required:
        - client_id
        - entity
        - entity_id
        - op
        - updated_at
        - payload
      properties:
        client_id: *a2
        entity:
          type: string
          enum:
            - session_set
        entity_id: *a2
        op:
          type: string
          enum:
            - upsert
        updated_at:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/AppendSetPayload"
    WeekExercise:
      type: object
      additionalProperties: false
      required:
        - exercise_id
        - planned_set_ids
        - set_count
      properties:
        exercise_id:
          type: string
          minLength: 1
        planned_set_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        set_count:
          type: integer
          minimum: 1
          maximum: 10
    ActualWeekSession:
      type: object
      additionalProperties: false
      required:
        - id
        - scheduled_date
        - focus
        - status
        - revision
        - planned_set_ids
        - exercises
        - origin
      properties:
        id:
          type: string
          format: uuid
        scheduled_date:
          type: string
          format: date
        focus:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - scheduled
            - in_progress
            - completed
        revision:
          type: string
          minLength: 1
        planned_set_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/WeekExercise"
        origin:
          type: string
          enum:
            - planned
            - ad_hoc
    CurrentProgramWeek:
      type: object
      additionalProperties: false
      required:
        - program_id
        - week_start
        - sessions
      properties:
        program_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ActualWeekSession"
    WeekSwapRequest:
      type: object
      additionalProperties: false
      required:
        - client_id
        - today_session_id
        - target_session_id
        - today_revision
        - target_revision
      properties:
        client_id:
          type: string
          format: uuid
        today_session_id:
          type: string
          format: uuid
        target_session_id:
          type: string
          format: uuid
        today_revision:
          type: string
          minLength: 1
        target_revision:
          type: string
          minLength: 1
    WeekSwapResult:
      type: object
      additionalProperties: false
      required:
        - client_id
        - program_id
        - week_start
        - today_session_id
        - sessions
      properties:
        client_id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date
        today_session_id:
          type: string
          format: uuid
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ActualWeekSession"
          minItems: 2
          maxItems: 2
    WeekSwapCandidate:
      type: object
      additionalProperties: false
      required:
        - session
        - eligible
        - reason
      properties:
        session:
          $ref: "#/components/schemas/ActualWeekSession"
        eligible:
          type: boolean
        reason:
          type: string
          nullable: true
          enum:
            - null
            - readonly
            - not_scheduled
            - performed_history
            - wrong_week
            - ambiguous_schedule
            - recovery_unverifiable
            - recovery_gap_violation
      allOf:
        - oneOf:
            - properties:
                eligible:
                  enum:
                    - true
                reason:
                  enum:
                    - null
            - properties:
                eligible:
                  enum:
                    - false
                reason:
                  type: string
                  enum:
                    - readonly
                    - not_scheduled
                    - performed_history
                    - wrong_week
                    - ambiguous_schedule
                    - recovery_unverifiable
                    - recovery_gap_violation
    WeekSwapCandidates:
      type: object
      additionalProperties: false
      required:
        - program_id
        - week_start
        - today_session_id
        - today_revision
        - candidates
        - today_eligible
        - today_reason
      properties:
        program_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date
        today_session_id:
          type: string
          format: uuid
          nullable: true
        today_revision:
          type: string
          minLength: 1
          nullable: true
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/WeekSwapCandidate"
        today_eligible:
          type: boolean
        today_reason:
          type: string
          nullable: true
          enum:
            - null
            - readonly
            - not_scheduled
            - performed_history
            - wrong_week
            - ambiguous_schedule
            - recovery_unverifiable
            - recovery_gap_violation
      allOf:
        - oneOf:
            - properties:
                today_eligible:
                  enum:
                    - true
                today_reason:
                  enum:
                    - null
                today_session_id:
                  type: string
                  format: uuid
                  nullable: false
                today_revision:
                  type: string
                  minLength: 1
                  nullable: false
            - properties:
                today_eligible:
                  enum:
                    - false
                today_reason:
                  type: string
                  enum:
                    - readonly
                    - not_scheduled
                    - performed_history
                    - wrong_week
                    - recovery_unverifiable
                    - recovery_gap_violation
                today_session_id:
                  type: string
                  format: uuid
                  nullable: false
                today_revision:
                  type: string
                  minLength: 1
                  nullable: false
            - properties:
                today_eligible:
                  enum:
                    - false
                today_reason:
                  enum:
                    - ambiguous_schedule
                today_session_id:
                  enum:
                    - null
                today_revision:
                  enum:
                    - null
    WeekSwapConflict:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - CONFLICT
            message:
              type: string
              minLength: 1
            details:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - readonly
                    - not_scheduled
                    - performed_history
                    - wrong_week
                    - ambiguous_schedule
                    - recovery_unverifiable
                    - recovery_gap_violation
                    - stale_revision
                    - idempotency_payload_mismatch
    SplitPreferenceProfileFields:
      type: object
      additionalProperties: false
      required: []
      properties:
        split_preference:
          type: string
          nullable: true
          enum: [null, balanced, upper_priority, lower_priority]
          description: PATCH 미지정은 유지, null은 clear. Program 소급 변경 없음.
        split_preference_supported:
          type: boolean
          readOnly: true
          description: Profile GET 전용. 활성 규칙에서 파생하며 bundle 버전은 노출하지 않는다.
    SplitGenerationFields:
      type: object
      additionalProperties: false
      required: []
      properties:
        split_preference:
          $ref: "#/components/schemas/SplitPreference"
    SplitProgramSnapshot:
      type: object
      additionalProperties: false
      required:
        - requested_preference
        - effective_preference
        - applicable
        - reason
        - upper_days
        - lower_days
      properties:
        requested_preference:
          type: string
          nullable: true
          enum:
            - null
            - balanced
            - upper_priority
            - lower_priority
        effective_preference:
          type: string
          nullable: true
          enum:
            - null
            - balanced
            - upper_priority
            - lower_priority
        applicable:
          type: boolean
        reason:
          type: string
          nullable: true
          enum:
            - null
            - unsupported_days
            - four_day_balanced_only
            - legacy_input
        upper_days:
          type: integer
          minimum: 0
          maximum: 5
        lower_days:
          type: integer
          minimum: 0
          maximum: 5
    FeatureConflict:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - CONFLICT
            message: *a3
            details:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - readonly
                    - set_cap_reached
                    - set_number_gap
                    - source_changed
                    - source_removed
                    - correlation_mismatch
                    - idempotency_payload_mismatch
                    - append_target_removed
                    - unsafe_assistance_snapshot
                    - unresolved_parent
                    - stale_revision
                    - recovery_gap_violation
                    - ambiguous_schedule
                    - insufficient_time_for_mixed_focus
                    - cardio_preservation_failed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: httpOnly·Secure·SameSite=Lax 세션 쿠키. 변경 요청에는 X-CSRF-Token 헤더가 필요하다.
x-afc-promotion:
  AppendSetSyncMutation: "Sprint03: extend SyncMutation oneOf/entity enum and
    dependency ordering, preserve existing mutation payloads and cursor/LWW
    behavior"
  RevisionedPlannedSet: "Sprint03: additive source_revision on PlannedSet
    wire/mirror, computed from raw prescription fields"
  SplitPreferenceProfileFields: "Promoted Sprint04 S3: nullable split_preference in Profile/ProfileUpdate,
    readonly split_preference_supported in Profile; additive User.splitPreference"
  SplitGenerationFields: "Promoted Sprint04 S3: optional non-null split_preference in GenerateProgramRequest"
  SplitProgramSnapshot: "Promoted Sprint04 S3: required split_preference_snapshot on Program;
    immutable requested/effective values in Program.generation_input; actual split application remains reserved"
  CurrentProgramWeek: "Sprint04: separate actual-week query; Program.sessions
    remains immutable template"
security:
  - cookieAuth: []
