name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # openapi.yaml만 바뀌고 생성물이 stale 해지는 것을 막는다(계약 드리프트 가드).
      - run: pnpm codegen
      - run: git diff --exit-code apps/web/lib/api-types.ts
      - run: pnpm typecheck
      - run: node --test scripts/ci-e2e.test.mjs
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      # 빌드 산출물·앱 소스에 테스트 시드(AFC_TEST_TODAY 등)가 없는지 확인한다.
      # "값을 안 주면 분기가 안 남는다"는 설계 주장이 실제로 틀렸던 적이 있다 — 사람이 믿는 대신 산출물을 본다.
      - run: pnpm --filter web verify:no-test-seed
      # 토큰 값에서 실사용 전경/배경 조합을 전부 계산해 AA(4.5:1)를 판정한다.
      # 완료 행 4.01:1(ADR-41)은 axe 스캔 대상이 아니라 사후에야 발견됐다. 계산은 그걸 놓치지 않는다.
      - run: pnpm --filter web verify:contrast
      # Pretendard가 다시 단일 대용량 4웨이트나 외부 CDN으로 회귀하지 않게 자산 수·용량·CSS 계약을 고정한다.
      - run: pnpm --filter web verify:font-payload
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afc_test

      # E2E 는 **실렌더로만 잡히는 것**을 지킨다: axe 19화면, AC-S1-6(버튼이 엄지 범위에 오는가),
      # 밀도 예산, "파랑 = 상태 / ink = 액션"의 실제 화면 결과.
      # 여기 없으면 이 가드들은 사람이 로컬에서 돌릴 때만 발화한다 — 그건 게이트가 아니다.
      # Playwright 가 API(:3101, `<db>_e2e`)와 웹(:3000)을 스스로 띄운다. DB 는 migrate deploy 가 만든다.
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web
      # 각 phase가 새 loopback DB/container/principal과 검증 가능한 소유권 manifest를 만든다.
      # headed persistent Chromium도 생략하지 않고 Xvfb에서 실행한다.
      - run: xvfb-run --auto-servernum node scripts/ci-e2e.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/e2e/.artifacts
            apps/web/e2e/.report
            apps/web/e2e/.artifacts-ci
          include-hidden-files: true
          retention-days: 7
      # A separate root prevents the Linux-only C: directory from entering archive paths.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-owned-evidence
          path: apps/web/C:/Users/amole/.traycer/evidence
          include-hidden-files: true
          retention-days: 7
    # NOTE: recommendation-engine golden tests MUST run here and block merge on failure.
